<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transparent track presentation</title>
    <link
      rel="stylesheet"
      href="../packages/viewer/dist/static/trackdraw-viewer.css"
    />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #fafafa;
        color: #17212b;
        font: 16px system-ui;
      }
      body.dark {
        background: #121926;
        color: #fff;
      }
      #course {
        width: 100%;
        height: 480px;
        max-width: 1000px;
      }
      button,
      select {
        margin: 4px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Transparent track presentation</h1>
    <p>
      Drag to orbit, scroll or pinch to zoom. The page background should remain
      visible around the bounded field.
    </p>
    <button id="background">Toggle light/dark page</button>
    <button id="reset">Host reset overview</button>
    <button id="narrow">Toggle narrow container</button>
    <button id="fallback">Toggle unavailable WebGL</button>
    <label
      >Course
      <select id="dimensions">
        <option value="60,40">Normal</option>
        <option value="12,8">Small</option>
        <option value="300,200">Large</option>
        <option value="200,12">Elongated</option>
        <option value="12,200">Elongated vertical</option>
      </select></label
    >
    <div id="course"></div>
    <button id="inspect">Inspect canvas alpha and image signature</button>
    <output id="diagnostics" aria-live="polite"></output>
    <script src="../packages/viewer/dist/static/trackdraw-viewer.global.js"></script>
    <script>
      const course = document.querySelector("#course");
      let forced = false,
        narrow = false;
      const options = { presentation: "transparent" };
      const viewer = TrackDrawViewer.createTrackDrawViewer(
        course,
        optionsWithDesign(60, 40)
      );
      function optionsWithDesign(width, height) {
        return {
          ...options,
          forceWebglUnsupported: forced,
          design: {
            version: 2,
            title: "Presentation example",
            field: { width, height, origin: "tl", gridStep: 1, ppm: 20 },
            shapes: [
              {
                id: "hurdle",
                kind: "barrier",
                variant: "hurdle",
                x: width * 0.5,
                y: height * 0.5,
                rotation: 20,
                width: 3,
                height: 1,
                meta: {
                  catalog: {
                    version: 1,
                    elementId: "multigp-hurdle",
                    assignedKind: "barrier",
                    official: true,
                  },
                },
              },
              {
                id: "gate",
                kind: "gate",
                x: width * 0.25,
                y: height * 0.25,
                rotation: 35,
                width: 3,
                height: 2,
              },
              {
                id: "gate2",
                kind: "gate",
                x: width * 0.75,
                y: height * 0.65,
                rotation: -45,
                width: 3,
                height: 3,
              },
              {
                id: "line",
                kind: "polyline",
                x: 0,
                y: 0,
                rotation: 0,
                points: [
                  { x: width * 0.25, y: height * 0.25 },
                  { x: width * 0.75, y: height * 0.65 },
                  { x: width * 0.8, y: height * 0.2 },
                  { x: width * 0.25, y: height * 0.25 },
                ],
                closed: false,
              },
            ],
            updatedAt: "2026-10-08T00:00:00.000Z",
          },
        };
      }
      function update() {
        const [width, height] = document
          .querySelector("#dimensions")
          .value.split(",")
          .map(Number);
        viewer.update(optionsWithDesign(width, height));
      }
      document.querySelector("#background").onclick = () => {
        document.body.classList.toggle("dark");
        options.theme = document.body.classList.contains("dark")
          ? "dark"
          : "light";
        update();
      };
      document.querySelector("#reset").onclick = () => viewer.resetOverview();
      document.querySelector("#narrow").onclick = () => {
        narrow = !narrow;
        course.style.width = narrow ? "320px" : "100%";
      };
      document.querySelector("#dimensions").onchange = update;
      document.querySelector("#fallback").onclick = () => {
        forced = !forced;
        update();
      };
      document.querySelector("#inspect").onclick = () => {
        const source = course.querySelector("canvas[data-engine]");
        if (!source) {
          document.querySelector("#diagnostics").textContent =
            "3D canvas unavailable";
          return;
        }
        const copy = document.createElement("canvas");
        copy.width = source.width;
        copy.height = source.height;
        const context = copy.getContext("2d");
        context.drawImage(source, 0, 0);
        const pixels = context.getImageData(0, 0, copy.width, copy.height).data;
        let clear = 0,
          opaque = 0,
          edges = 0,
          hash = 2166136261;
        for (let i = 0; i < pixels.length; i += 4) {
          const alpha = pixels[i + 3];
          if (alpha === 0) clear++;
          else if (alpha === 255) opaque++;
          else edges++;
          for (let j = 0; j < 4; j++)
            hash = Math.imul(hash ^ pixels[i + j], 16777619);
        }
        document.querySelector("#diagnostics").textContent =
          `Alpha: clear=${clear}, opaque=${opaque}, antialiased=${edges}; corner=${pixels[3]}; image=${hash >>> 0}`;
      };
      window.addEventListener("pagehide", () => viewer.destroy());
    </script>
  </body>
</html>
