---
name: Tests

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_NODE: 24

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
          cache: npm
      - name: 🏗 Install dependencies
        run: npm ci
      - name: 🚀 Run Vitest
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
          cache: npm
      - name: 🏗 Install dependencies
        run: npm ci
      - name: 🚀 Run package build
        run: npm run build
      - name: Build demo site
        run: node scripts/demo.mjs --build
      - name: Verify demo deployment bundle
        run: npx wrangler deploy --config wrangler.demo.jsonc --dry-run
      - name: Verify standalone package
        run: npm run test:package
