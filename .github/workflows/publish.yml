---
name: Publish to npm

# yamllint disable-line rule:truthy
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dutchdronesquad/track-viewer' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Set version from the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Use a stable vX.Y.Z release tag');
          const version = tag.slice(1);
          assert.notEqual(version, '0.0.0', '0.0.0 is reserved for development');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@trackdraw/viewer');
          assert.equal(pkg.version, '0.0.0', 'Keep the repository version at 0.0.0');
          execFileSync('npm', ['version', version, '--no-git-tag-version', '--ignore-scripts'], { stdio: 'inherit' });
          const path = 'src/snapshot/version.ts';
          const source = readFileSync(path, 'utf8');
          const pattern = /export const RENDERER_VERSION = "[^"]+";/;
          assert.match(source, pattern, 'Renderer version declaration must exist');
          writeFileSync(path, source.replace(pattern, `export const RENDERER_VERSION = "${version}";`));
          JS
      - name: Install dependencies and build
        # The prepare lifecycle runs the existing build, including declarations and CSS.
        run: npm ci
      - name: Validate
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
      - name: Check renderer version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { RENDERER_VERSION, CURRENT_REQUIRED_VIEWER, RENDERER_CAPABILITIES, isViewerCompatible } from './dist/snapshot/version.js';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(RENDERER_VERSION, pkg.version, 'Built renderer version must match the release');
          assert.ok(isViewerCompatible(CURRENT_REQUIRED_VIEWER, { rendererVersion: pkg.version, capabilities: new Set(RENDERER_CAPABILITIES) }), 'Release must support the current snapshot compatibility floor');
          JS
      - name: Pack the built package
        run: npm pack --ignore-scripts
      - name: Publish to npm
        # Optional bootstrap token for the first publish; subsequent releases use OIDC.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./trackdraw-viewer-*.tgz --ignore-scripts --access public --provenance --tag latest
