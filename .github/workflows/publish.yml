---
name: Publish to npm

# yamllint disable-line rule:truthy
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dutchdronesquad/track-viewer' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Set release version
        run: |
          node scripts/set-release-version.mjs "$GITHUB_REF_NAME"
      - name: Install and build
        run: npm ci
      - name: Publish schema first
        run: npm publish --workspace @trackdraw/schema --ignore-scripts --provenance
      - name: Publish viewer
        run: npm publish --workspace @trackdraw/viewer --ignore-scripts --provenance
