---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_NODE: 24

jobs:
  oxlint:
    name: Oxlint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
          cache: npm
      - name: 🏗 Install dependencies
        run: npm ci
      - name: 🚀 Run Oxlint
        run: npm run lint

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
          cache: npm
      - name: 🏗 Install dependencies
        run: npm ci
      - name: 🚀 Run Prettier
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
          cache: npm
      - name: 🏗 Install dependencies
        run: npm ci
      - name: 🚀 Run tsc --noEmit
        run: npm run typecheck

  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
          cache: npm
      - name: 🏗 Install dependencies
        run: npm ci
      - name: 🚀 Run Vitest
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Set up Node.js ${{ env.DEFAULT_NODE }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.DEFAULT_NODE }}
          cache: npm
      - name: 🏗 Install dependencies
        run: npm ci
      - name: 🚀 Run package build
        run: npm run build
